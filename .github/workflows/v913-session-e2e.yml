name: RealTalent V9.13–V11.7 — Publicação Segura e Regressão
on:
  pull_request:
    branches: [main]
    paths:
      - 'profissional/**'
      - 'cliente/**'
      - 'core/**'
      - 'assets/**'
      - 'qa/**'
      - 'build-manifest.json'
      - 'seguro/**'
      - 'supabase/**'
      - 'apresentacoes/**'
      - '.github/workflows/v913-session-e2e.yml'
  push:
    branches:
      - 'feature/v9-11-kit-profissional'
      - 'feature/v9-17-guided-activities-cycle'
      - 'feature/v10-secure-foundation'
      - 'feature/v11-presentation-studio'
      - 'feature/v11-1-session-presentations'
      - 'feature/v11-2-secure-presentations'
      - 'feature/v11-3-biblioteca-apresentador'
      - 'feature/v11-4-apresentador-profissional-2'
      - 'feature/v11-5-biblioteca-profissional'
      - 'feature/v11-6-acoes-ferramentas-ux'
      - 'feature/v11-7-construtor-ferramentas'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-qa:
    name: Chromium — atendimento completo desktop/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar integridade SHA256
        run: python scripts/verify-build.py
      - name: Testes estruturais V9.11, V9.12 e V9.13
        run: |
          node qa/testar-kit-profissional-v911.js
          node qa/testar-ferramentas-desenvolvimento-v912.js
          node qa/testar-perguntas-temporizador-v913.js
          node qa/testar-v916-vinculos.js
          node qa/testar-ciclo-atividades-v917.js
      - name: Segurança V10 — contratos estáticos e sintaxe
        run: |
          node --check seguro/app.mjs
          node qa/testar-seguranca-v10.js
      - name: Estúdio V11 — contratos e sintaxe
        run: |
          node --check apresentacoes/studio.js
          node qa/testar-apresentacoes-v110.js
      - name: Sessões e Apresentações V11.1 — contratos
        run: node qa/testar-apresentacoes-sessoes-v111.js
      - name: V11.2 — contrato RLS e sanitização de slides
        run: |
          node --check seguro/presentations.mjs
          node qa/testar-apresentacoes-seguras-v112.mjs
      - name: V11.3 — contratos de Biblioteca e Apresentador
        run: |
          node --check apresentacoes/visualizador.js
          node --check apresentacoes/central.js
          node --check assets/rt-presentation-library-v113.js
          node qa/testar-apresentador-v113.mjs
      - name: V11.4 — estrutura e sintaxe do PDF.js integrado
        run: |
          node --check apresentacoes/visualizador.js
          node qa/testar-apresentador-v114.mjs
          python -m py_compile scripts/ensure-pdfjs-v114.py qa/testar-apresentador-v114.py
      - name: Instalar PDF.js pinado no runner
        run: |
          python scripts/ensure-pdfjs-v114.py
          test -s vendor/pdfjs/pdf.mjs
          test -s vendor/pdfjs/pdf.worker.mjs
      - name: V11.5 — migração, pastas, filtros e visões salvas
        run: |
          node --check biblioteca/app.js
          node --check biblioteca/presentation-workspace-v115.js
          node qa/testar-biblioteca-v115.mjs
          python -m py_compile qa/testar-biblioteca-v115.py
      - name: V11.6 — contratos do Professional, privacidade e ferramentas próprias
        run: |
          node --check profissional/app.js
          node --check assets/rt-v116-custom-tools.js
          node qa/testar-professional-v116.mjs
          python -m py_compile qa/testar-professional-v116.py
      - name: V11.7 — formulários personalizados e validação de respostas
        run: |
          node --check assets/rt-v116-custom-tools.js
          node --check assets/rt-v117-tool-builder.js
          node --check core/demo-store.js
          node --check profissional/app.js
          node --check cliente/app.js
          node qa/testar-ferramentas-v117.mjs
          python -m py_compile qa/testar-ferramentas-v117.py
      - name: Instalar Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Playwright E2E — V11.1 sessões e compartilhamento
        run: python qa/testar-apresentacoes-sessoes-v111.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V11.3 Biblioteca e Apresentador
        run: python qa/testar-apresentador-v113.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V11.7 Criar, atribuir e responder formulário
        run: python qa/testar-ferramentas-v117.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V11.6 Plano de ação, Kit contextual e ferramentas
        run: python qa/testar-professional-v116.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V11.5 Biblioteca Profissional
        run: python qa/testar-biblioteca-v115.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V11.4 PDF real e anotações por página
        run: python qa/testar-apresentador-v114.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V11 estúdio
        run: python qa/testar-apresentacoes-v110.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V10 beta sem configuração
        run: python qa/testar-acesso-seguro-v10.py
      - name: Playwright E2E — V9.13
        run: python qa/testar-fluxo-atendimento-v913.py
      - name: Playwright E2E — V9.14
        run: python qa/testar-atendimento-integrado-v914.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V9.15 jornada profissional
        run: python qa/testar-jornada-profissional-v915.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V9.16 objetivos e ações
        run: python qa/testar-objetivos-acoes-v916.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Playwright E2E — V9.17 ciclo das atividades
        run: python qa/testar-ciclo-atividades-v917.py
        env:
          REALTALENT_QA_OUTPUT: /tmp/realtalent-v913-qa
      - name: Evidências (screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v913-v914-e2e-screenshots
          path: /tmp/realtalent-v913-qa/
          if-no-files-found: ignore
          retention-days: 7
