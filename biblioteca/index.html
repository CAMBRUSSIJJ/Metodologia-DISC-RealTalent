<script type="application/json" id="library-data">{"records":[{"id":"art:fundamentos","kind":"Artigos","group":"conceitos","title":"Fundamentos do modelo","subtitle":"O que o DISC/ACER descreve","body":"O DISC organiza preferências de comportamento em quatro dimensões. A nomenclatura ACER foi informada pelo responsável do projeto como sua tradução para português. Esta biblioteca mantém um modelo único, com rótulos DISC e sinônimos de consulta ACER.","alert":"Perfis são combinações, não caixas rígidas. A mesma pessoa pode agir de modo diferente conforme objetivo, experiência, segurança psicológica e contexto.","points":["Peça exemplos de ações observáveis em vez de presumir traços permanentes.","Explore as quatro dimensões, incluindo as menos salientes.","Diferencie autoavaliação, observação e resultados práticos."],"keywords":"conceitos DISC ACER fundamentos"},{"id":"art:origem","kind":"Artigos","group":"conceitos","title":"História e desenvolvimento","subtitle":"Da teoria comportamental aos instrumentos","body":"O modelo DISC tem raízes na obra de William Moulton Marston de 1928. Questionários e produtos posteriores foram desenvolvidos por diferentes organizações; não existe garantia de equivalência entre todos eles.","alert":"Uma adaptação de nomes para outro idioma não transforma automaticamente o instrumento original em teste validado. Itens, normas, escalas e populações devem ser examinados separadamente.","points":["Registrar autoria e origem de cada instrumento.","Não usar dados de confiabilidade de um fornecedor como prova da validade da versão RealTalent.","Documentar mudanças de item e algoritmo."],"keywords":"conceitos DISC ACER origem"},{"id":"art:dimensoes","kind":"Artigos","group":"conceitos","title":"As quatro dimensões","subtitle":"D, I, S e C em linguagem de trabalho","body":"D descreve iniciativa diante de desafios; I, comunicação e envolvimento; S, ritmo e cooperação; C, qualidade, critérios e processos. Cada fator está presente em graus variados.","alert":"As descrições são hipóteses de preferência comportamental, não fatos definitivos sobre uma pessoa. Um D elevado não demonstra capacidade gerencial; um C elevado não comprova inteligência.","points":["Conectar cada leitura a exemplos concretos.","Acolher casos em que o perfil não se ajusta.","Evitar comparações de valor entre perfis."],"keywords":"conceitos DISC ACER dimensoes"},{"id":"art:leitura","kind":"Artigos","group":"interpretacao","title":"Como interpretar um resultado","subtitle":"Leitura contextual e cuidadosa","body":"Comece pela composição dos quatro fatores e pelo contexto de resposta. Não reduza o resultado a uma letra, uma cor ou um ranking entre pessoas. Quando a pontuação vier do questionário do ZIP, descreva-a como indicador exploratório.","alert":"Compare hipóteses comportamentais com fatos, relatos e oportunidades de desenvolvimento. Explique margens de interpretação quando a psicometria ainda não foi estudada.","points":["Pergunte: em que situações isso aparece?","Busque um exemplo que confirma e outro que contraria a hipótese.","Escolha uma ação de desenvolvimento verificável."],"keywords":"interpretacao DISC ACER leitura"},{"id":"art:pontuacao","kind":"Artigos","group":"interpretacao","title":"Pontuação e limites","subtitle":"Escores não são percentis","body":"O aplicativo original contabiliza escolhas associadas a D, I, S e C. Frequências de respostas não são automaticamente percentis populacionais, aptidão, probabilidade de êxito ou intensidade clínica.","alert":"Exibir uma porcentagem de escolhas como “preferência no instrumento” exige contextualizar número de itens, regra de cálculo e limites. Não aplicar pontos de corte sem estudos específicos.","points":["Publicar fórmula e versão do cálculo.","Registrar dados ausentes, versões e alterações.","Não comparar indivíduos usando métricas incomparáveis."],"keywords":"interpretacao DISC ACER pontuacao"},{"id":"art:contexto","kind":"Artigos","group":"interpretacao","title":"Comportamento e ambiente","subtitle":"Preferências mudam conforme o contexto","body":"Pressão, cargo, cultura, confiança, familiaridade com a tarefa e incentivos influenciam comportamentos observados. Diferenças entre autoimagem e percepção de expectativa externa precisam ser exploradas como narrativas, não interpretadas automaticamente como conflito psicológico.","alert":"É inadequado afirmar que a pessoa possui “verdadeiro eu” em uma escala e “máscara” em outra sem fundamentação empírica.","points":["Perguntar sobre exemplos recentes em ambientes distintos.","Investigar variáveis situacionais.","Evitar inferir causas clínicas."],"keywords":"interpretacao DISC ACER contexto"},{"id":"art:feedback","kind":"Artigos","group":"comunicacao","title":"Feedback orientado ao comportamento","subtitle":"Fatos, impacto e acordo","body":"Um feedback útil descreve situação, comportamento observável, impacto e uma próxima ação verificável. Preferências de comunicação ajudam a escolher a forma, mas não alteram a obrigação de dar informações claras e respeitosas.","alert":"Evite rotular a pessoa (“você é D, por isso interrompe”). Prefira “na reunião de ontem houve três interrupções; precisamos garantir espaço de fala”.","points":["Observar e registrar o episódio.","Perguntar a perspectiva da pessoa.","Combinar comportamento e data de revisão."],"keywords":"comunicacao DISC ACER feedback"},{"id":"art:adaptacao","kind":"Artigos","group":"comunicacao","title":"Adaptação de comunicação","subtitle":"Ajustar a forma sem manipular","body":"Com interlocutores que valorizam velocidade, sintetize decisões; com os mais expressivos, estimule troca; com os que buscam estabilidade, explique a transição; com os criteriosos, apresente evidências.","alert":"Essas são hipóteses de preferência. Pergunte diretamente como a pessoa deseja receber informação; jamais atribua estilo apenas à aparência.","points":["Confirmar ritmo e formato preferido.","Entregar informação essencial a todos.","Registrar acordos em linguagem simples."],"keywords":"comunicacao DISC ACER adaptacao"},{"id":"art:conflitos","kind":"Artigos","group":"comunicacao","title":"Conflitos e negociação interna","subtitle":"Transformar diferenças em acordos","body":"Conflitos muitas vezes surgem de ritmo, nível de detalhe, expectativas e critérios distintos. O DISC pode ser usado como vocabulário para perguntar sobre necessidades, não como explicação conclusiva de uma disputa.","alert":"Investigue incentivos, poder, sobrecarga e processos; nem todo conflito é comportamental.","points":["Nomear o desacordo sem acusação.","Separar fatos de interpretações.","Registrar uma experiência de cooperação com revisão."],"keywords":"comunicacao DISC ACER conflitos"},{"id":"art:reunioes","kind":"Artigos","group":"comunicacao","title":"Reuniões inclusivas","subtitle":"Ouvir decisões e informações","body":"Reuniões de qualidade combinam objetivo, informações prévias, turnos de participação e responsáveis. Modere estilos mais dominantes sem excluir iniciativa; dê espaço aos reservados sem obrigá-los a exposição pública.","alert":"A preferência individual não determina o direito de falar ou decidir.","points":["Enviar pauta antes.","Solicitar contribuições de forma inclusiva.","Encerrar com decisão, dono e prazo."],"keywords":"comunicacao DISC ACER reunioes"},{"id":"art:lideranca","kind":"Artigos","group":"lideranca","title":"Liderança adaptativa","subtitle":"Gestão de pessoas sem estereótipos","body":"Liderar exige resultados e qualidade das relações. O modelo pode apoiar conversas sobre autonomia, suporte, ritmo e critérios, mas não substitui avaliação de competências e desempenho observável.","alert":"Não atribua pessoas a cargos com base em uma letra.","points":["Perguntar de que suporte cada pessoa precisa.","Definir expectativas iguais de resultado e justas de condição.","Revisar o estilo de gestão com feedback do time."],"keywords":"lideranca DISC ACER"},{"id":"art:equipes","kind":"Artigos","group":"lideranca","title":"Complementaridade de equipes","subtitle":"Diversidade de perspectivas, não quotas de letras","body":"Uma equipe pode se beneficiar de iniciativa, envolvimento, continuidade e rigor. Isso não significa que seja necessário contratar pessoas em proporções predefinidas de D, I, S e C.","alert":"Utilize a biblioteca para construir práticas inclusivas e combinados; não para classificar pessoas como “fit” ou “não fit” sem evidência independente.","points":["Mapear processos que precisam de revisão.","Garantir contraditório nas decisões importantes.","Distribuir responsabilidades por competência, interesse e carga."],"keywords":"lideranca DISC ACER equipes"},{"id":"art:mudanca","kind":"Artigos","group":"lideranca","title":"Gestão da mudança","subtitle":"Transições claras e participativas","body":"Mudanças são mais bem conduzidas com propósito, impacto, plano de implantação, canal de dúvidas e aprendizado. Diferentes pessoas podem solicitar velocidade, participação, previsibilidade ou evidências.","alert":"Tratar dúvidas como insumos do projeto, não resistência pessoal.","points":["Comunicar antes do anúncio amplo quando pertinente.","Definir pilotos e critérios de sucesso.","Medir adoção com dados e relatos."],"keywords":"lideranca DISC ACER mudanca"},{"id":"art:onboarding","kind":"Artigos","group":"lideranca","title":"Integração de pessoas","subtitle":"Acolhimento e expectativas claras","body":"No onboarding, pergunte ao colaborador o que ajuda a trabalhar bem: frequência de acompanhamento, autonomia, informação, feedback e forma de comunicação. O perfil pode oferecer pistas, nunca regras obrigatórias.","alert":"Evite apresentar um rótulo ao time sem finalidade clara e base legal adequada.","points":["Construir acordo de trabalho.","Ajustar conforme experiência real.","Rever após 30, 60 e 90 dias."],"keywords":"lideranca DISC ACER onboarding"},{"id":"art:vendas","kind":"Artigos","group":"vendas","title":"Vendas consultivas","subtitle":"Conectar necessidades, evidência e decisão","body":"Em vendas, adaptar o discurso significa escutar as prioridades reais do comprador. Para quem privilegia resultados, mostre impacto; para quem valoriza relacionamento, colaboração; para quem busca estabilidade, implantação; para quem pede detalhes, evidências.","alert":"A linguagem DISC não autoriza adivinhar o perfil de um lead nem manipular vulnerabilidades.","points":["Perguntar critérios de decisão ao comprador.","Confirmar objetivos, limitações e próximos passos.","Documentar necessidades no CRM de forma minimizada."],"keywords":"vendas DISC ACER"},{"id":"art:descoberta","kind":"Artigos","group":"vendas","title":"Perguntas de descoberta comercial","subtitle":"Explorar sem rotular","body":"Uma descoberta eficaz investiga desafio, impacto, urgência, pessoas envolvidas, condições de sucesso e riscos. Perguntas devem ser abertas e neutras, evitando supor que o cliente tem um estilo por falar rápido ou pedir dados.","alert":"Adaptação de comunicação não é uma licença para direcionar a resposta do comprador.","points":["O que precisa melhorar?","Como você avaliará sucesso?","Quais riscos precisam ser resolvidos?"],"keywords":"vendas DISC ACER descoberta"},{"id":"art:objecoes","kind":"Artigos","group":"vendas","title":"Objeções em vendas","subtitle":"Entender antes de responder","body":"Objeções sobre preço, prazo, segurança ou integração pedem diagnóstico: que alternativa existe, qual custo de não resolver, qual evidência falta e quem decide. Use tom e profundidade ajustados ao interlocutor, sem atribuir objeção ao perfil.","alert":"Não use suposto estilo comportamental para contornar consentimento ou omitir informação.","points":["Validar a preocupação.","Separar fato de hipótese.","Propor teste ou material verificável."],"keywords":"vendas DISC ACER objecoes"},{"id":"art:posvenda","kind":"Artigos","group":"vendas","title":"Pós-venda e sucesso do cliente","subtitle":"Entrega alinhada ao contrato","body":"Na implantação, diferentes clientes preferem cadências e formatos de acompanhamento. Defina desde o início contatos, canais, responsabilidades, critérios de aceite e forma de escalonamento.","alert":"Meça satisfação e adoção; não use o perfil para presumir satisfação.","points":["Definir indicadores acordados.","Registrar mudanças de escopo.","Realizar check-ins de adoção."],"keywords":"vendas DISC ACER posvenda"},{"id":"art:atendimento","kind":"Artigos","group":"servicos","title":"Atendimento e experiência","subtitle":"Jornadas que acolhem diferentes necessidades","body":"Um serviço acessível oferece caminhos distintos para resolver a mesma demanda: resposta rápida, explicação guiada, acompanhamento humano e documentação. O DISC pode inspirar opções de experiência, não segmentação rígida.","alert":"O usuário deve poder escolher o atendimento adequado sem ter seu comportamento inferido automaticamente.","points":["Oferecer formatos claros.","Informar prazos de modo transparente.","Verificar resolução da necessidade."],"keywords":"servicos DISC ACER atendimento"},{"id":"art:desenvolvimento","kind":"Artigos","group":"desenvolvimento","title":"Planos de desenvolvimento","subtitle":"Experimentos de comportamento observável","body":"Um plano de desenvolvimento parte de uma situação real, escolhe um comportamento a experimentar, define frequência e indicador observável e revisa o resultado. A pessoa participa da escolha e pode discordar da hipótese sugerida pelo perfil.","alert":"Não transforme uma característica exploratória em deficiência permanente.","points":["Definir um alvo por vez.","Agendar reflexão e feedback.","Registrar o que funcionou em cada contexto."],"keywords":"desenvolvimento DISC ACER"},{"id":"art:facilitacao","kind":"Artigos","group":"desenvolvimento","title":"Workshops e dinâmicas","subtitle":"Aprendizagem com segurança psicológica","body":"Em oficinas, cada pessoa pode explorar preferências de trabalho por meio de casos, reflexões e acordos. Evite divulgação compulsória de resultados e comparação pública de colegas.","alert":"A facilitação deve explicar confidencialidade, finalidade e possibilidade de não participar.","points":["Acordar regras de respeito.","Utilizar cenários fictícios.","Encerrar com ações de equipe, não rótulos."],"keywords":"desenvolvimento DISC ACER facilitacao"},{"id":"art:etica","kind":"Artigos","group":"governanca","title":"Ética, ciência e privacidade","subtitle":"Limites claros para decisões sobre pessoas","body":"Cada instrumento exige evidência específica de validade e confiabilidade para sua finalidade. O fato de um fornecedor apresentar pesquisa para seu teste não valida automaticamente o questionário presente no ZIP RealTalent. Resultados individuais devem ser acessados apenas por quem tem finalidade e autorização adequadas.","alert":"No Brasil, testes psicológicos e avaliações psicológicas têm regras profissionais específicas; é importante verificar enquadramento e consultar o CFP/SATEPSI, inclusive na modalidade online.","points":["Não usar resultado isoladamente para contratação ou desligamento.","Aplicar LGPD: finalidade, necessidade, transparência e segurança.","Oferecer correção, contestação e revisão humana conforme o caso."],"keywords":"governanca DISC ACER etica"},{"id":"art:instrumento","kind":"Artigos","group":"governanca","title":"Questionário original do projeto","subtitle":"Material extraído e pendente de revisão","body":"O ZIP disponibilizado continha 20 perguntas de escolha e 92 adjetivos associados a quatro fatores. A biblioteca os preserva em JSON separado, mantendo seu status de “revisão pendente” por questões de construção de itens, viés e ausência de dados psicométricos específicos.","alert":"As alternativas seguem posições fixas no código original (D, I, C, S). Recomenda-se avaliar viés de posição e o impacto de alterar a ordem sem prejudicar comparabilidade dos dados anteriores.","points":["Revisar ambiguidade e desejabilidade social.","Examinar itens que não correspondem claramente ao fator marcado.","Criar estudo de consistência, estabilidade, validade e documentação antes de uso avaliativo."],"keywords":"governanca DISC ACER instrumento"},{"id":"perfil:D","kind":"Perfis","group":"Perfis","title":"D · Dominância","subtitle":"Direção e resultados","body":"Tendência a agir sobre desafios com assertividade, velocidade e foco no resultado.","details":[{"head":"Essência","text":"Tendência a agir sobre desafios com assertividade, velocidade e foco no resultado."},{"head":"Quando pode aparecer","text":"O comportamento pode aparecer quando há autonomia para decidir, metas claras ou pressão por entrega."},{"head":"Pontos fortes","text":["Toma decisões e assume responsabilidade","Enfrenta obstáculos sem paralisar","Define prioridades e acelera execução","Expõe pontos de discordância com clareza"]},{"head":"Motivadores","text":["Autonomia com responsabilidade","Desafios relevantes","Critérios claros de sucesso","Liberdade para propor soluções"]},{"head":"Necessidades","text":["Objetivo e impacto esperados","Poder decidir o caminho com limites definidos","Informação essencial de forma direta","Feedback rápido sobre resultados"]},{"head":"Atenções","text":["Atropelar a escuta e o alinhamento","Subestimar o impacto relacional","Tratar urgência como regra","Confundir discordância com falta de compromisso"]},{"head":"Sob pressão (hipóteses)","text":["Intensifica cobrança e velocidade","Pode interromper explicações","Pode assumir tarefas em excesso para controlar o resultado"]},{"head":"Como se comunicar","text":["Comece pelo objetivo e decisão requerida","Mostre duas ou três opções, impactos e prazo","Indique responsabilidades e limites","Convide a ouvir riscos sem diluir a mensagem"]},{"head":"Feedback","text":"Descreva fatos, impacto, próximo comportamento observável e indicador de avanço; evite disputa de poder."},{"head":"Desenvolvimento","text":["Antes de decidir, pedir uma objeção substantiva","Realizar rodadas de escuta em reuniões","Conferir sustentabilidade da entrega, não cação e procura validação","Pode dispersar diante de críticas","Pode minimizar detalhes e restrições"]},{"head":"Como se comunicar","text":["Abra com o propósito e impacto humano","Use exemplos e convide a participar","Termine com responsabilidades, critérios e prazo","Registre decisões por escrito"]},{"head":"Feedback","text":"Reconheça contribuição concreta e delimite o comportamento a ajustar; priorize exemplos e compromissos verificáveis."},{"head":"Desenvolvimento","text":["Converter ideias em uma lista de próximos passos","Treinar conversas difíceis com respeito","Reservar blocos de foco e revisão","Conferir compromissos antes de oferecer prazos"]},{"head":"Em vendas","text":"Construa relação e demonstre valor com histórias verificáveis; confirme detalhes de implementação e próximos passos."},{"head":"Na liderança","text":"Use o entusiasmo para facilitar alinhamento, com decisões, donos e marcos documentados."},{"head":"Perguntas de coaching","text":["Como transformar a ideia em entrega concreta?","Qual conversa precisa acontecer mesmo sendo desconfortável?","Que compromisso depende de confirmação antes de ser assumido?"]},{"head":"O que não se deve inferir","text":["Habilidade universal de negociação","Honestidade","Popularidade necessária em todo contexto","Resultado de vendas"]}],"keywords":"DISC ACER I Influência Conexão e mobilização"},{"id":"perfil:S","kind":"Perfis","group":"Perfis","title":"S · Estabilidade","subtitle":"Constância e cooperação","body":"Tendência a valorizar consistência, apoio mútuo, previsibilidade e relações colaborativas.","details":[{"head":"Essência","text":"Tendência a valorizar consistência, apoio mútuo, previsibilidade e relações colaborativas."},{"head":"Quando pode aparecer","text":"Pode aparecer em processos de acompanhamento, suporte, cuidado com relações e mudanças graduais."},{"head":"Pontos fortes","text":["Sustenta acordos e rotinas","Escuta com atenção","Oferece apoio confiável","Contribui para continuidade operacional <script type="application/json" id="advanced-data">{"D":{"slogan":"Direção com escuta — rapidez sem perder qualidade","situacoes":[{"id":"prazo","area":"Liderança","titulo":"Prazo em risco","cenario":"Um cliente pede antecipar uma entrega em dois dias. A equipe alerta que ainda falta uma revisão crítica. Você precisa responder hoje.","pergunta":"Qual seria um bom primeiro movimento para equilibrar agilidade e segurança?","alternativas":[{"texto":"Confirmar o novo prazo imediatamente para demonstrar liderança.","feedback":"A decisão rápida pode transmitir segurança, mas promete algo antes de conhecer o risco. Uma comunicação responsável distingue intenção de compromisso viável."},{"texto":"Pedir à equipe duas opções com impacto e risco, definir o limite aceitável e responder ao cliente.","feedback":"Esta alternativa reúne decisão e informação essencial. Torna explícitos os critérios para assumir ou renegociar o prazo, sem desconsiderar a equipe."},{"texto":"Recusar qualquer mudança sem explorar possibilidades.","feedback":"Protege o plano original, mas fecha possibilidades antes de verificar alternativas reversíveis. O contexto pode justificar recusar, porém com critérios claros."}],"reflexao":"Quais duas informações são indispensáveis antes de assumir um compromisso?","microacao":"Na próxima decisão urgente, faça uma pergunta sobre risco antes de concluir."},{"id":"feedback","area":"Comunicação","titulo":"Uma reunião com discordância","cenario":"Uma pessoa da equipe contesta sua proposta diante dos colegas. O prazo está apertado, mas a objeção pode revelar um problema real.","pergunta":"Como avançar sem transformar discordância em confronto?","alternativas":[{"texto":"Interromper a objeção para encerrar o assunto.","feedback":"Pode economizar tempo no instante, mas aumenta o risco de ignorar informação relevante e reduzir a segurança para questionamentos futuros."},{"texto":"Pedir que a pessoa resuma o risco, registrar a objeção e definir a decisão com prazo.","feedback":"Abre espaço para evidências e mantém responsabilidade sobre a decisão. É uma forma de combinar escuta estruturada e direção."},{"texto":"Deixar a reunião sem conclusão para evitar atrito.","feedback":"Reduz o conflito imediato, mas pode aumentar a ambiguidade. É melhor distinguir uma pausa deliberada de uma decisão sem dono."}],"reflexao":"O que você poderia perguntar para separar opinião de evidência?","microacao":"Em uma reunião, convide explicitamente uma objeção bem fundamentada."},{"id":"proposta","area":"Vendas","titulo":"O cliente pede uma proposta objetiva","cenario":"O cliente diz que quer ir direto aos números, mas ainda não explicou restrições operacionais nem quem aprova a contratação.","pergunta":"Como manter objetividade sem pular a descoberta?","alternativas":[{"texto":"Enviar imediatamente o preço final sem perguntas.","feedback":"Entrega rapidez, porém o preço pode não refletir o problema nem as condições. Informação incompleta aumenta retrabalho."},{"texto":"Apresentar um resumo curto e pedir duas informações que mudam o escopo.","feedback":"Respeita o desejo de concisão enquanto valida requisitos essenciais. Também permite apresentar opções de forma transparente."},{"texto":"Conduzir uma apresentação longa para explicar todos os detalhes.","feedback":"Pode ser excessivo para uma pessoa que pediu síntese. Detalhes são úteis se forem relevantes para a decisão e apresentados no momento adequado."}],"reflexao":"Que pergunta curta aumentaria a precisão da sua proposta?","microacao":"Antes de enviar uma proposta, confirme dois critérios concretos de sucesso."}],"mitos":["Agilidade não significa incapacidade de ouvir.","Assertividade não comprova competência de liderança.","Questionar uma decisão não é falta de compromisso."],"dialogo":{"contexto":"Alinhamento de prazo","menos_util":"Precisamos fazer isso hoje, sem discussão.","mais_util":"Precisamos decidir hoje. Quais são os dois riscos mais importantes e as opções possíveis? Depois assumo a decisão."},"experimentos":["Fazer uma rodada de escuta de 90 segundos antes de definir uma prioridade.","Conferir qualidade e carga da equipe após uma entrega acelerada.","Registrar a premissa mais importante da próxima decisão."]},"I":{"slogan":"Conexão com execução — entusiasmo acompanhado de acordos","situacoes":[{"id":"alinhamento","area":"Liderança","titulo":"Reunião produtiva, tarefas confusas","cenario":"A reunião terminou com energia e boas ideias. Dois dias depois, ninguém sabe quem é responsável pelas entregas.","pergunta":"O que fortalece a colaboração sem perder a execução?","alternativas":[{"texto":"Confiar que todos lembram o combinado.","feedback":"O engajamento é valioso, mas não garante alinhamento. Acordos verificáveis evitam interpretações diferentes."},{"texto":"Sintetizar decisões, responsáveis, prazo e critério de conclusão em mensagem acessível.","feedback":"Conecta participação à entrega e facilita ajustes futuros. A clareza ajuda equipes com diversas preferências de trabalho."},{"texto":"Cancelar espaços de discussão para evitar novas ideias.","feedback":"Pode reduzir dispersão, mas também descarta contribuição. É mais útil definir quando divergir, decidir e executar."}],"reflexao":"Qual entrega precisa de um responsável explícito nesta semana?","microacao":"Ao terminar a próxima reunião, registre três decisões e seus responsáveis."},{"id":"conversa","area":"Comunicação","titulo":"Conversa desconfortável","cenario":"Um colega costuma interromper apresentações. O relacionamento é bom, mas o comportamento começa a afetar a equipe.","pergunta":"Como dar feedback preservando o respeito?","alternativas":[{"texto":"Fazer piadas para sinalizar o problema indiretamente.","feedback":"O humor pode ser interpretado de várias maneiras e não deixa claro o comportamento esperado."},{"texto":"Conversar em particular, citar uma situação específica e combinar uma mudança observável.","feedback":"Traz clareza sem atacar a pessoa. O acordo pode ser revisado com base em comportamentos, não em rótulos."},{"texto":"Evitar a conversa para preservar o clima.","feedback":"Pode aliviar desconforto temporário, mas deixa o problema persistir. Relações de confiança também precisam de limites explícitos."}],"reflexao":"Como iniciar a conversa com respeito e um exemplo concreto?","microacao":"Prepare uma frase de feedback com fato, impacto e pedido claro."},{"id":"promessa","area":"Vendas","titulo":"Entusiasmo na negociação","cenario":"O cliente se empolga com a demonstração e pede uma funcionalidade que não está confirmada no produto.","pergunta":"Como manter o vínculo sem prometer além do escopo?","alternativas":[{"texto":"Garantir a funcionalidade para não perder o clima positivo.","feedback":"A promessa pode criar risco contratual e prejudicar confiança. Relação de longo prazo exige limites verificáveis."},{"texto":"Reconhecer a necessidade, confirmar com a equipe técnica e registrar uma resposta com prazo.","feedback":"Equilibra acolhimento e compromisso responsável. A transparência ajuda o cliente a decidir com informação confiável."},{"texto":"Ignorar a pergunta e seguir a demonstração.","feedback":"Perde a chance de entender a necessidade real. Perguntar por que o recurso importa pode revelar alternativas."}],"reflexao":"Como dizer “vou confirmar” de modo seguro e colaborativo?","microacao":"Na próxima negociação, diferencie recursos demonstrados, previstos e não confirmados."}],"mitos":["Sociabilidade não garante capacidade de negociação.","Entusiasmo não exclui disciplina ou profundidade.","Preferir interações não significa buscar aprovação sempre."],"dialogo":{"contexto":"Transformar ideias em ação","menos_util":"Foi incrível! Vamos fazer tudo o que discutimos.","mais_util":"Tivemos três boas ideias. Qual cabe nesta semana, quem ficará responsável e como verificamos o resultado?"},"experimentos":["Encerrar reuniões com um quadro de decisões e próximos passos.","Planejar uma conversa difícil em três frases antes de iniciá-la.","Confirmar capacidade de entrega antes de citar um prazo."]},"S":{"slogan":"Colaboração com assertividade — apoio sem perder limites","situacoes":[{"id":"mudanca","area":"Liderança","titulo":"Mudança de processo inesperada","cenario":"Um processo importante será substituído na próxima semana. Parte da equipe está insegura sobre treinamento e suporte.","pergunta":"Que atitude ajuda uma transição responsável?","alternativas":[{"texto":"Dizer apenas que todos precisam aceitar a mudança.","feedback":"Pode comunicar urgência, mas não responde às necessidades práticas. Mudanças funcionam melhor com critérios, apoio e espaço para dúvidas."},{"texto":"Explicar o motivo, definir etapas, canais de apoio e ouvir riscos que afetem o trabalho.","feedback":"Combina transparência com planejamento. Ouvir riscos não significa adiar indefinidamente a decisão."},{"texto":"Adiar toda mudança até que não exista desconforto.","feedback":"Reduz atrito no curto prazo, mas pode comprometer um objetivo necessário. É útil distinguir riscos reais de desconfortos administráveis."}],"reflexao":"Qual mudança pequena poderia ser testada antes da implantação total?","microacao":"Em uma mudança, registre uma dúvida da equipe e seu plano de resposta."},{"id":"limite","area":"Comunicação","titulo":"Demandas além do combinado","cenario":"Uma pessoa pede ajuda novamente, mas sua agenda já está cheia e você corre o risco de atrasar sua própria entrega.","pergunta":"Como preservar cooperação e responsabilidade?","alternativas":[{"texto":"Aceitar mesmo sabendo que não conseguirá cumprir o prazo.","feedback":"A intenção de ajudar é positiva, mas prometer sem capacidade pode prejudicar ambas as entregas."},{"texto":"Explicar sua capacidade atual e oferecer um horário alternativo ou outro caminho.","feedback":"Estabelece limite claro sem abandonar colaboração. Ajuda a negociar prioridades de forma respeitosa."},{"texto":"Não responder para evitar uma negativa.","feedback":"Pode manter a tensão e dificultar planejamento. Uma negativa explícita com contexto costuma ser mais útil do que silêncio."}],"reflexao":"Como expressar um limite sem pedir desculpas pelo próprio trabalho?","microacao":"Negocie uma prioridade usando “posso entregar X até Y” em vez de assumir tudo."},{"id":"implantacao","area":"Vendas","titulo":"Cliente pede segurança na implantação","cenario":"O cliente teme que a adoção da solução interrompa uma rotina crítica. A equipe comercial está focada no fechamento rápido.","pergunta":"Como responder à preocupação?","alternativas":[{"texto":"Dizer que não haverá problemas, sem dados de implantação.","feedback":"A garantia sem base pode reduzir confiança caso ocorram imprevistos. É melhor apresentar riscos, mitigação e suporte reais."},{"texto":"Mapear a rotina crítica, propor implantação por etapas e confirmar suporte disponível.","feedback":"Traduz a preocupação em critérios verificáveis. O cliente pode então avaliar o risco de forma informada."},{"texto":"Mudar para descontos sem discutir a implementação.","feedback":"Preço pode ser relevante, mas não resolve necessariamente o receio operacional. É importante compreender a objeção antes de responder."}],"reflexao":"Qual evidência concreta de continuidade o cliente precisa?","microacao":"Em uma proposta, inclua um plano de transição com responsáveis e ponto de revisão."}],"mitos":["Busca de previsibilidade não implica resistência à mudança.","Cooperação não significa incapacidade de discordar.","Ritmo cauteloso não determina desempenho."],"dialogo":{"contexto":"Negociar limites","menos_util":"Tudo bem, eu faço, mesmo que fique difícil.","mais_util":"Posso ajudar amanhã pela manhã. Hoje preciso concluir a entrega combinada. Essa alternativa atende à prioridade?"},"experimentos":["Praticar uma negativa respeitosa em um pedido de baixa prioridade.","Propor uma mudança pequena com prazo de avaliação.","Perguntar se o silêncio em uma reunião representa concordância ou dúvida."]},"C":{"slogan":"Qualidade com fluidez — critérios claros sem paralisar decisões","situacoes":[{"id":"decisao","area":"Liderança","titulo":"Dados incompletos e decisão reversível","cenario":"A equipe precisa escolher uma ferramenta para um piloto de duas semanas. Há dados suficientes para testar, mas nem todas as questões foram respondidas.","pergunta":"Como manter o rigor sem atrasar um experimento reversível?","alternativas":[{"texto":"Exigir que todos os riscos sejam eliminados antes de testar.","feedback":"Eliminar toda incerteza pode ser impossível. Para decisões reversíveis, critérios de parada e um piloto limitado podem produzir evidências melhores."},{"texto":"Definir critérios mínimos, executar um piloto controlado e revisar resultados.","feedback":"Preserva rigor e promove aprendizagem. O tipo de risco determina se um teste é apropriado."},{"texto":"Escolher uma ferramenta aleatoriamente para ganhar velocidade.","feedback":"Economiza análise, mas não estabelece parâmetros para avaliar sucesso ou falha. Agilidade não exige ausência de critério."}],"reflexao":"Quais informações realmente mudariam a decisão?","microacao":"Classifique uma decisão como reversível ou irreversível antes de decidir o nível de análise."},{"id":"sintese","area":"Comunicação","titulo":"Apresentação com excesso de detalhes","cenario":"Você precisa explicar riscos técnicos a uma liderança que tem dez minutos e decidirá sobre o próximo passo do projeto.","pergunta":"Que estrutura ajuda sem omitir informações relevantes?","alternativas":[{"texto":"Ler todo o relatório técnico integralmente.","feedback":"As informações podem ser corretas, mas a atenção disponível e o objetivo da conversa exigem uma síntese com acesso aos detalhes."},{"texto":"Começar pela decisão necessária, três evidências-chave e os riscos, deixando anexos disponíveis.","feedback":"Ajuda a liderança a decidir e mantém rastreabilidade. Se houver risco crítico, ele deve aparecer claramente na síntese."},{"texto":"Apresentar apenas uma conclusão sem evidências.","feedback":"Reduz tempo, mas enfraquece a transparência sobre incertezas e alternativas. Síntese e rigor são complementares."}],"reflexao":"Qual informação é indispensável para quem precisa decidir hoje?","microacao":"Resuma um documento técnico em decisão, evidência e risco, em três linhas."},{"id":"objecao","area":"Vendas","titulo":"Objeção técnica legítima","cenario":"O cliente questiona segurança, integração e limitações do serviço. Sua equipe comercial considera a conversa longa demais.","pergunta":"Como avançar respeitando critérios de avaliação?","alternativas":[{"texto":"Tratar as perguntas como resistência sem importância.","feedback":"Desvaloriza critérios que podem ser essenciais para a compra. Informações verificáveis são parte da confiança comercial."},{"texto":"Classificar perguntas por criticidade, documentar respostas e combinar uma próxima decisão.","feedback":"Mantém precisão com direção. Dúvidas desconhecidas devem receber responsáveis e prazo para resposta, sem promessas infundadas."},{"texto":"Enviar centenas de páginas sem resumo e encerrar o contato.","feedback":"Material completo pode ser importante, mas sem estrutura torna difícil entender o que já está respondido e o que precisa de decisão."}],"reflexao":"Como diferenciar exigência contratual de preferência secundária?","microacao":"Organize objeções em obrigatórias, desejáveis e verificáveis no piloto."}],"mitos":["Cuidado com detalhes não define inteligência.","Pensamento crítico não equivale a frieza emocional.","Precisão não exige perfeição em toda tarefa."],"dialogo":{"contexto":"Síntese executiva","menos_util":"Antes de decidir, preciso explicar todos os 25 pontos do relatório.","mais_util":"A decisão é esta; há três evidências importantes e um risco relevante. O relatório detalhado está disponível para consulta."},"experimentos":["Definir um critério objetivo de qualidade suficiente antes de iniciar uma tarefa.","Resumir uma análise em três achados e um próximo passo.","Testar <script type="application/json" id="lab-data">{"meta":{"versao":"3.2","aviso":"Conteúdo educacional com personagens fictícios. Não presume o perfil de pessoas reais nem calcula competências."},"cenarios":[{"id":"feedback","area":"Liderança","titulo":"Feedback sobre atrasos","contexto":"Um líder conversa com uma pessoa que atrasou duas entregas.","interlocutor":"Colaborador(a)","etapas":[{"fala":"Percebi que precisamos conversar. O que aconteceu?","pergunta":"Como iniciar uma conversa sobre resultados?","alternativas":[{"texto":"Você sempre atrasa tudo.","resposta":"Esse tom me deixa na defensiva.","feedback":"Generalizações atribuem uma característica à pessoa e dificultam entender fatos."},{"texto":"Na terça e na sexta, a entrega passou do prazo. O que dificultou cumprir o combinado?","resposta":"Houve mudanças de prioridade que eu não consegui organizar.","feedback":"Fatos observáveis e perguntas abertas criam espaço para identificar causas."},{"texto":"Vamos ignorar o assunto desta vez.","resposta":"Tudo bem... mas o problema pode continuar.","feedback":"Evitar o tema reduz desconforto imediato, mas não estabelece melhoria."}]},{"fala":"Às vezes recebo pedidos urgentes de outras áreas.","pergunta":"Como construir um acordo de melhoria?","alternativas":[{"texto":"Você precisa dar um jeito, independentemente das demandas.","resposta":"Não sei qual entrega priorizar quando tudo é urgente.","feedback":"Uma ordem sem critério mantém a ambiguidade de prioridades."},{"texto":"Vamos priorizar juntas as demandas e definir quando avisar sobre riscos de prazo.","resposta":"Assim consigo sinalizar conflitos antes do vencimento.","feedback":"Prioridades claras e aviso antecipado tornam o plano verificável."},{"texto":"Não quero me envolver com a sua organização.","resposta":"Entendo, mas continuo com o mesmo impasse.","feedback":"Responsabilidades precisam ser combinadas quando dependências organizacionais afetam resultados."}]},{"fala":"Podemos revisar isso na próxima semana?","pergunta":"Como encerrar com acompanhamento?","alternativas":[{"texto":"Se acontecer de novo, haverá consequências.","resposta":"Gostaria de entender o que preciso mudar concretamente.","feedback":"Consequências podem existir, mas o acordo precisa primeiro ser específico e justo."},{"texto":"Combinamos a nova prioridade, o aviso de risco até quarta e uma revisão na sexta. Tudo claro?","resposta":"Sim, podemos acompanhar dessa maneira.","feedback":"Um acordo com prazo e critério facilita acompanhamento e ajustes."},{"texto":"Tudo certo, depois vemos.","resposta":"Certo... não sei qual será o próximo passo.","feedback":"Sem registro da próxima ação, fica difícil identificar progresso."}]}]},{"id":"cliente","area":"Vendas","titulo":"Cliente questiona o preço","contexto":"Um cliente considera a proposta cara e pede justificativas.","interlocutor":"Cliente","etapas":[{"fala":"Gostei da solução, mas o valor está acima do que planejei.","pergunta":"Como acolher a objeção?","alternativas":[{"texto":"Então essa solução não é para você.","resposta":"Eu só queria entender se o investimento faz sentido.","feedback":"Uma objeção não equivale a recusa; desqualificar o cliente encerra a descoberta."},{"texto":"Entendi. Em relação a qual alternativa ou orçamento você está comparando?","resposta":"Tenho outra proposta, mas ela não inclui implantação.","feedback":"Entender critérios permite comparar escopo e valor sem pressão."},{"texto":"Posso dar desconto agora mesmo, sem analisar.","resposta":"Desconto parece bom, mas ainda tenho dúvidas.","feedback":"Reduzir preço antes de compreender a objeção pode ocultar critérios importantes."}]},{"fala":"A outra empresa cobra menos, porém a implantação é separada.","pergunta":"Como esclarecer diferenças de escopo?","alternativas":[{"texto":"A concorrência certamente entrega menos qualidade.","resposta":"Você tem dados para confirmar isso?","feedback":"Evite alegações sobre terceiros sem evidências."},{"texto":"Vamos comparar custo total, implantação, suporte e critérios de sucesso lado a lado.","resposta":"Ótimo, assim consigo avaliar o conjunto.","feedback":"Uma comparação verificável melhora a qualidade da decisão."},{"texto":"Nossa proposta é melhor, pode confiar.","resposta":"Preciso justificar a escolha internamente.","feedback":"Afirmações genéricas não substituem evidências concretas."}]},{"fala":"Preciso levar a avaliação para minha diretoria.","pergunta":"Como combinar o próximo passo?","alternativas":[{"texto":"Preciso de uma resposta agora.","resposta":"Não posso decidir sem a diretoria.","feedback":"Pressão ignora o processo real de compra."},{"texto":"Envio um quadro comparativo e podemos revisar os critérios após a reunião. Qual data ajuda?","resposta":"Na quinta-feira consigo discutir isso.","feedback":"Próximo passo acordado respeita a governança do cliente."},{"texto":"Vou mandar vários documentos e você decide sozinho.","resposta":"Será difícil organizar o material todo.","feedback":"Documentos são úteis quando priorizam os pontos decisivos."}]}]},{"id":"mudanca","area":"Liderança","titulo":"Anunciar mudança de processo","contexto":"A equipe receberá uma nova rotina de atendimento em duas semanas.","interlocutor":"Equipe","etapas":[{"fala":"Isso vai mudar todo o nosso jeito de trabalhar?","pergunta":"Como comunicar o propósito?","alternativas":[{"texto":"Vocês terão que se adaptar.","resposta":"Mas por quê?","feedback":"Uma ordem sem contexto tende a gerar dúvidas não resolvidas."},{"texto":"Vamos mudar o registro para reduzir retrabalho. Vou mostrar o que muda e ouvir riscos.","resposta":"Entendi o objetivo. Quais tarefas mudam?","feedback":"Explicar objetivo e impactos cria condições para participação informada."},{"texto":"Não se preocupem, nada será diferente.","resposta":"Então por que haverá treinamento?","feedback":"Minimizar impactos reais prejudica a confiança."}]},{"fala":"Estamos preocupados com atendimento durante a transição.","pergunta":"Como responder à preocupação?","alternativas":[{"texto":"Essa preocupação não importa agora.","resposta":"O atendimento pode ser afetado.","feedback":"Desconsiderar uma dependência operacional é arriscado."},{"texto":"Vamos testar em uma equipe, oferecer suporte e medir tempo de atendimento.","resposta":"Assim poderemos antecipar problemas.","feedback":"Um piloto com apoio e indicadores pode reduzir riscos."},{"texto":"Deixem os riscos para depois.","resposta":"Então não teremos como prevenir falhas.","feedback":"Planejamento prévio evita surpresas previsíveis."}]},{"fala":"Como saberemos se a mudança funcionou?","pergunta":"Como fechar o alinhamento?","alternativas":[{"texto":"Vamos perceber com o tempo.","resposta":"Que sinais precisamos acompanhar?","feedback":"Acompanhamento vago dificulta aprendizagem."},{"texto":"Compararemos retrabalho, tempo e feedback em duas revisões com responsáveis definidos.","resposta":"Temos critérios claros para avaliar.","feedback":"Critérios observáveis e pontos de revisão sustentam mudanças."},{"texto":"Não haverá necessidade de avaliação.","resposta":"Fica difícil dizer se melhorou.","feedback":"Sem avaliação, melhorias não ficam demonstráveis."}]}]},{"id":"conflito","area":"Comunicação","titulo":"Resolver um conflito entre colegas","contexto":"Duas pessoas discordam sobre o responsável por uma tarefa.","interlocutor":"Colega","etapas":[{"fala":"A responsabilidade era da outra área.","pergunta":"Como iniciar a mediação?","alternativas":[{"texto":"Vocês sempre criam problemas.","resposta":"Isso parece uma acusação.","feedback":"Rótulos pessoais podem aumentar a polarização."},{"texto":"Vamos separar fatos, combinados e responsabilidades atuais. O que foi registrado?","resposta":"Temos mensagens diferentes sobre a mesma entrega.","feedback":"Diferenciar evidência e interpretação diminui a personalização do conflito."},{"texto":"Prefiro não entrar nessa discussão.","resposta":"O trabalho continua travado.","feedback":"Evitar o conflito não resolve a ambiguidade uda a reconstruir confiança."},{"texto":"Isso não é responsabilidade minha.","resposta":"Mas estou falando com a empresa.","feedback":"Uma transferência sem encaminhamento mantém a frustração."}]},{"fala":"A solicitação é importante para meu trabalho de hoje.","pergunta":"Como lidar com incerteza?","alternativas":[{"texto":"Vai estar resolvido em uma hora, pode confiar.","resposta":"Vou contar com isso.","feedback":"Não prometa prazo sem confirmação operacional."},{"texto":"Vou verificar com o time responsável e retornar às 15h, mesmo que ainda esteja em análise.","resposta":"Uma atualização nesse horário ajuda.","feedback":"Comprometer-se com a comunicação, sem inventar resolução, é mais responsável."},{"texto":"Não há previsão, então não posso ajudar.","resposta":"Existe ao menos uma alternativa?","feedback":"Explorar contingências pode ser útil mesmo sem prazo de solução."}]},{"fala":"Existe algo que eu possa fazer enquanto isso?","pergunta":"Como encerrar com apoio?","alternativas":[{"texto":"Não, só espere.","resposta":"Fico sem um caminho para trabalhar.","feedback":"Encerramento abrupto pode deixar necessidades legítimas sem resposta."},{"texto":"Vou registrar a prioridade, confirmar se há alternativa e enviar resumo do combinado.","resposta":"Ótimo, assim consigo me organizar.","feedback":"Resumo e alternativas aumentam clareza de acompanhamento."},{"texto":"Vou encerrar o chamado por enquanto.","resposta":"Mas o problema não foi resolvido.","feedback":"Encerramento prematuro cria retrabalho e perda de confiança."}]}]},{"id":"reuniao","area":"Comunicação","titulo":"Reunião com muita dispersão","contexto":"Uma reunião de planejamento gera ideias, mas não decisões.","interlocutor":"Participante","etapas":[{"fala":"Temos mais cinco ideias para acrescentar!","pergunta":"Como dar foco sem cortar contribuições?","alternativas":[{"texto":"Não quero mais nenhuma sugestão.","resposta":"Mas talvez algumas sejam importantes.","feedback":"Cortar todas as ideias elimina informação útil."},{"texto":"Vamos registrar ideias extras e voltar ao objetivo: decidir a prioridade de hoje.","resposta":"Podemos deixar as demais para a próxima rodada.","feedback":"Timeboxing e estacionamento de ideias conciliam participação e foco."},{"texto":"Que ótimo! Vamos explorar tudo sem limite.","resposta":"Ainda não temos uma decisão.","feedback":"Sem critério, o entusiasmo pode gerar dispersão."}]},{"fala":"Temos duas opções boas, mas preferências diferentes.","pergunta":"Como decidir com clareza?","alternativas":[{"texto":"A decisão será a minha e pronto.","resposta":"Queria entender o critério.","feedback":"Decisões pouco explicadas podem comprometer comprometimento."},{"texto":"Vamos comparar impacto, esforço e riscos e definir quem decide ao final.","resposta":"Assim fica transparente.","feedback":"Critérios e responsabilidade decisória permitem concluir o debate."},{"texto":"Vamos votar sem discutir impacto.","resposta":"Pode vencer a opção mais popular, não a mais adequada.","feedback":"Votação sem critérios pode ignorar restrições importantes."}]},{"fala":"Escolhemos o caminho. O que acontece agora?","pergunta":"Como concluir de forma operacional?","alternativas":[{"texto":"Cada um já sabe o que fazer.","resposta":"Acho que entendemos entregas diferentes.","feedback":"Pressupor entendimento pode gerar duplicidade."},{"texto":"Registramos tarefa, responsável, prazo e o primeiro ponto de revisão.","resposta":"Com isso consigo começar.","feedback":"Acordos explícitos transformam conversa em execução."},{"texto":"Vamos falar disso na próxima reunião.","resposta":"Então o trabalho não começa hoje.","feedback":"Adiar responsabilidade aumenta a inércia."}]}]},{"id":"objecao","area":"Vendas","titulo":"Objeção técnica em uma negociação","contexto":"O prospect pergunta sobre integração e proteção de dados.","interlocutor":"Prospect","etapas":[{"fala":"Sua plataforma integra com nosso sistema atual?","pergunta":"Como responder sem inventar?","alternativas
